---
- name: Copy a file to remote host
  hosts: all
  become: yes
  tasks:
    - name: Copy example.txt to remote host
      ansible.builtin.copy:
        src: /ansible/ssh.config  # Path inside the container
        dest: /etc/ssh/sshd_config.d/60-cloudimg-settings.conf  # Path on the remote host
      notify: Restart SSH


  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted