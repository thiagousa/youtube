apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx
  name: nginx
spec:
  ports:
  - name: http
    port: {{ .Values.service.port | default 80 }}
    protocol: TCP
    targetPort: {{ .Values.service.targetPort | default 80 }}
  selector:
    app: nginx
  type: {{ .Values.service.type | default "LoadBalancer" }}
status:
  loadBalancer: {}
