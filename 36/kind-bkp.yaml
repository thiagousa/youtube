# kind.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kind-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            "service-account-issuer": "kubernetes.default.svc"
    extraPortMappings:
      # Map host 80/443 to the node; ingress-nginx will use hostPorts 80/443
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
